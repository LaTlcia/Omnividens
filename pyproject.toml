[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilyrex"
version = "0.2.0"
requires-python = ">=3.11"
description = "GVG monitor, damage preview and offline replay"

[project.scripts]
lilyrex = "lilyrex.cli:main"

[project.optional-dependencies]
monitor = [
  "python-socketio==4.6.1",
  "python-engineio==3.14.2",
  "websocket-client==1.9.0",
  "websockets==15.0.1",
  "requests==2.32.5",
  "Pillow>=10.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lilyrex = ["data/*.json", "data/namebases/*.json", "data/assets/*.png", "data/assets/Sprite/*.png"]
